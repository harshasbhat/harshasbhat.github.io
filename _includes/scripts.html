<script>
// Light / dark switch. With nothing saved, the page follows the system setting.
(function () {
  var root = document.documentElement;
  var btn = document.getElementById("theme-toggle");
  var mq = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;

  function current() {
    var t = root.getAttribute("data-theme");
    if (t === "light" || t === "dark") return t;
    return mq && mq.matches ? "dark" : "light";
  }
  function label() {
    if (!btn) return;
    var next = current() === "dark" ? "light" : "dark";
    btn.setAttribute("aria-label", "Switch to " + next + " theme");
    btn.setAttribute("title", "Switch to " + next + " theme");
  }
  function announce() {
    label();
    document.dispatchEvent(new CustomEvent("themechange", { detail: current() }));
  }
  if (btn) {
    btn.addEventListener("click", function () {
      var next = current() === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next);
      try { localStorage.setItem("theme", next); } catch (e) {}
      announce();
    });
  }
  if (mq && mq.addEventListener) mq.addEventListener("change", announce);
  label();
})();

// On phones the nav scrolls sideways: bring the current page's link into view.
(function () {
  var nav = document.querySelector(".site-nav"), cur = nav && nav.querySelector('[aria-current="page"]');
  if (nav && cur && nav.scrollWidth > nav.clientWidth) nav.scrollLeft = cur.offsetLeft - nav.offsetLeft - 16;
})();

// Back-to-top link: shown once the reader has scrolled a screen.
(function () {
  var top = document.getElementById("js-top");
  if (!top) return;
  function onScroll() { top.classList.toggle("show", window.scrollY > window.innerHeight * 0.8); }
  window.addEventListener("scroll", onScroll, { passive: true });
  top.addEventListener("click", function (e) {
    e.preventDefault();
    window.scrollTo({ top: 0, behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  });
  onScroll();
})();

// Accordions used on the older research pages.
(function () {
  var acc = document.getElementsByClassName("accordion");
  for (var i = 0; i < acc.length; i++) {
    acc[i].addEventListener("click", function () {
      this.classList.toggle("active");
      var panel = this.nextElementSibling;
      panel.style.display = panel.style.display === "block" ? "none" : "block";
    });
  }
})();
</script>
