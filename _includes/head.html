<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

	<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
	<meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
	<meta name="color-scheme" content="light dark">

	<!-- Apply the saved theme before first paint, so there is no flash. -->
	<script>
	(function () {
				var t = null;
		try { t = localStorage.getItem("theme"); } catch (e) {}
		document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
	})();
	</script>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<!-- Avenir is used where installed (macOS, iOS); Nunito Sans is the free fallback everywhere else. -->
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,500;6..12,600;6..12,700&display=swap">
	<link rel="stylesheet" href="{{ "/css/main.css" | prepend: site.baseurl }}">

	<link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">
	<meta property="og:title" content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}">
	<meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
	<meta property="og:image" content="https://harshasbhat.github.io/images/harsha.jpg">
	<meta property="og:type" content="website">
</head>
