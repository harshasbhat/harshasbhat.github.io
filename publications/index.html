sk-url-1":"https://doi.org/10.1007/s00024-016-1354-4","ENTRYTYPE":"article","ID":"perol2016","_raw":"@article{perol2016,\n\tauthor = {Perol, T. and Bhat, H. S.},\n\tdoi = {10.1007/s00024-016-1354-4},\n\tjournal = {Pure Appl. Geophys.},\n\tpages = {1--12},\n\tpubnumber = {23},\n\ttitle = {Micromechanics based permeability evolution in brittle materials at high strain rates},\n\tyear = {2016}\n}","_pdf":"https://filedn.eu/lg5rE6ReEB4XtX4pGFBGRh4/CollectedPapers/article/PerolBhat2016a.pdf"},{"author":"Mello, M. and Bhat, H. S. and Rosakis, A. J. and Kanamori, H.","doi":"10.1016/j.epsl.2013.11.030","journal":"Earth Planet. Sc. Lett.","pages":"89--96","pubnumber":"17","title":"Reproducing The Supershear Portion Of The 2002 Denali Earthquake Rupture In Laboratory","volume":"387","year":"2014","bdsk-url-1":"https://doi.org/10.1016/j.epsl.2013.11.030","ENTRYTYPE":"article","ID":"mello2014","_raw":"@article{mello2014,\n\tauthor = {Mello, M. and Bhat, H. S. and Rosakis, A. J. and Kanamori, H.},\n\tdoi = {10.1016/j.epsl.2013.11.030},\n\tjournal = {Earth Planet. Sc. Lett.},\n\tpages = {89--96},\n\tpubnumber = {17},\n\ttitle = {Reproducing The Supershear Portion Of The 2002 Denali Earthquake Rupture In Laboratory},\n\tvolume = {387},\n\tyear = {2014}\n}","_pdf":"https://filedn.eu/lg5rE6ReEB4XtX4pGFBGRh4/CollectedPapers/article/MelloBhatRosakis2014a.pdf"},{"abstract":"Supershear earthquake ruptures propagate faster than the shear wave velocity. Although there is evidence that this occurs in nature, it has not been experimentally demonstrated with the use of crustal rocks. We performed stick-slip experiments with Westerly granite under controlled upper-crustal stress conditions. Supershear ruptures systematically occur when the normal stress exceeds 43 megapascals (MPa) with resulting stress drops on the order of 3 to 25 MPa, comparable to the stress drops inferred by seismology for crustal earthquakes. In our experiments, the sub-Rayleigh--to--supershear transition length is a few centimeters at most, suggesting that the rupture of asperities along a fault may propagate locally at supershear velocities. In turn, these sudden accelerations and decelerations could play an important role in the generation of high-frequency radiation and the overall rupture-energy budget.","author":"Passel{\\`e}gue, Fran{\\c c}ois X. and Schubnel, Alexandre and Nielsen, Stefan and Bhat, Harsha S. and Madariaga, Ra{\\`u}l","doi":"10.1126/science.1235637","journal":"Science","number":"6137","pages":"1208-1211","pubnumber":"16","title":"From Sub-Rayleigh to Supershear Ruptures During Stick-Slip Experiments on Crustal Rocks","volume":"340","year":"2013","bdsk-url-1":"https://doi.org/10.1126/science.1235637","ENTRYTYPE":"article","ID":"passelegue2013","_raw":"@article{passelegue2013,\n\tabstract = {Supershear earthquake ruptures propagate faster than the shear wave velocity. Although there is evidence that this occurs in nature, it has not been experimentally demonstrated with the use of crustal rocks. We performed stick-slip experiments with Westerly granite under controlled upper-crustal stress conditions. Supershear ruptures systematically occur when the normal stress exceeds 43 megapascals (MPa) with resulting stress drops on the order of 3 to 25 MPa, comparable to the stress drops inferred by seismology for crustal earthquakes. In our experiments, the sub-Rayleigh--to--supershear transition length is a few centimeters at most, suggesting that the rupture of asperities along a fault may propagate locally at supershear velocities. In turn, these sudden accelerations and decelerations could play an important role in the generation of high-frequency radiation and the overall rupture-energy budget.},\n\tauthor = {Passel{\\`e}gue, Fran{\\c c}ois X. and Schubnel, Alexandre and Nielsen, Stefan and Bhat, Harsha S. and Madariaga, Ra{\\`u}l},\n\tdoi = {10.1126/science.1235637},\n\tjournal = {Science},\n\tnumber = {6137},\n\tpages = {1208-1211},\n\tpubnumber = {16},\n\ttitle = {From Sub-Rayleigh to Supershear Ruptures During Stick-Slip Experiments on Crustal Rocks},\n\tvolume = {340},\n\tyear = {2013}\n}","_pdf":"https://filedn.eu/lg5rE6ReEB4XtX4pGFBGRh4/CollectedPapers/article/Passele%CC%80gueSchubnelNielsen2013a.pdf"},{"editor":"Bizzarri, A. and Bhat, H. S.","isbn":"978-81-308-0502-3","publisher":"Research Signpost","title":"The mechanics of faulting: From laboratory to earthquakes","year":"2012","ENTRYTYPE":"proceedings","ID":"bizzarri2012","_raw":"@proceedings{bizzarri2012,\n\teditor = {Bizzarri, A. and Bhat, H. S.},\n\tisbn = {978-81-308-0502-3},\n\tpublisher = {Research Signpost},\n\ttitle = {The mechanics of faulting: From laboratory to earthquakes},\n\tyear = {2012}\n}","_pdf":"https://filedn.eu/lg5rE6ReEB4XtX4pGFBGRh4/CollectedPapers/proceedings/BizzarriBhat2012a.pdf"},{"author":"Bhat, H. S. and Rosakis, A. J. and Sammis, C. G.","doi":"10.1115/1.4005897","journal":"J. Appl. Mech.","number":"3","pubnumber":"15","title":"A Micromechanics Based Constitutive Model For Brittle Failure at High Strain Rates","volume":"79","year":"2012","bdsk-url-1":"https://doi.org/10.1115/1.4005897","ENTRYTYPE":"article","ID":"bhat2012","_raw":"@article{bhat2012,\n\tauthor = {Bhat, H. S. and Rosakis, A. J. and Sammis, C. G.},\n\tdoi = {10.1115/1.4005897},\n\tjournal = {J. Appl. Mech.},\n\tnumber = {3},\n\tpubnumber = {15},\n\ttitle = {A Micromechanics Based Constitutive Model For Brittle Failure at High Strain Rates},\n\tvolume = {79},\n\tyear = {2012}\n}","_pdf":"https://filedn.eu/lg5rE6ReEB4XtX4pGFBGRh4/CollectedPapers/article/BhatRosakisSammis2012a.pdf"},{"author":"Mello, M. and Bhat, H. S. and Rosakis, A. J. and Kanamori, H.","doi":"10.1016/j.tecto.2010.07.003","journal":"Tectonophysics","pages":"297--326","pubnumber":"11","title":"Identifying the unique ground motion signatures of supershear earthquakes: Theory and experiments","volume":"493","year":"2010","bdsk-url-1":"https://doi.org/10.1016/j.tecto.2010.07.003","ENTRYTYPE":"article","ID":" JB006174","ENTRYTYPE":"article","ID":"templeton2009","_raw":"@article{templeton2009,\n\tauthor = {Templeton, E. L. and Baudet, A. and Bhat, H. S. and Dmowska, R. and Rice, J. R. and Rosakis, A. J. and Rousseau, C. E.},\n\tdoi = {10.1029/2008jb006174},\n\tjournal = {J. Geophys. Res.},\n\tpubnumber = {7},\n\ttitle = {Finite Element Simulations of Dynamic Shear Rupture Experiments and Dynamic Path Selection Along Kinked and Branched Faults},\n\tvolume = {B08304},\n\tyear = {2009}\n}","_pdf":"https://filedn.eu/lg5rE6ReEB4XtX4pGFBGRh4/CollectedPapers/article/TempletonBaudetBhat2009a.pdf"},{"author":"Harris, R. A. and Barall, M. and Archuleta, R. J. and Dunham, E. M. and Aagaard, B. and Ampuero, J-P and Bhat, H. S. and Cruz-Atienza, V. and Dalguer, L. and Dawson, P. and Day, S. M. and Duan, B. and Ely, G. and Kaneko, Y. and Kase, Y. and Lapusta, N. and Liu, Y. and Ma, S. and Oglesby, D. D. and Olsen, K. B. and Pitarka, A. and Song, S. and Templeton, E. L.","doi":"10.1785/gssrl.80.1.119","journal":"Seismol. Res. Lett.","number":"1","pubnumber":"9","title":"The SCEC/USGS dynamic earthquake rupture code verification exercise","volume":"80","year":"2009","bdsk-url-1":"https://doi.org/10.1785/gssrl.80.1.119","ENTRYTYPE":"article","ID":"harris2009","_raw":"@article{harris2009,\n\tauthor = {Harris, R. A. and Barall, M. and Archuleta, R. J. and Dunham, E. M. and Aagaard, B. and Ampuero, J-P and Bhat, H. S. and Cruz-Atienza, V. and Dalguer, L. and Dawson, P. and Day, S. M. and Duan, B. and Ely, G. and Kaneko, Y. and Kase, Y. and Lapusta, N. and Liu, Y. and Ma, S. and Oglesby, D. D. and Olsen, K. B. and Pitarka, A. and Song, S. and Templeton, E. L.},\n\tdoi = {10.1785/gssrl.80.1.119},\n\tjournal = {Seismol. Res. Lett.},\n\tnumber = {1},\n\tpubnumber = {9},\n\ttitle = {The SCEC/USGS dynamic earthquake rupture code verification exercise},\n\tvolume = {80},\n\tyear = {2009}\n}","_pdf":"https://filedn.eu/lg5rE6ReEB4XtX4pGFBGRh4/CollectedPapers/article/HarrisBarallArchuleta2009a.pdf"},{"abstract":"Radiating shear and Rayleigh waves from supershear ruptures form Mach waves that transmit large-amplitude ground motion and stresses to locations far from the fault. We simulate bilateral ruptures on a finite-width vertical strike-slip fault (of width W and half-length L with L >> W) breaking the surface of an elastic half-space, and focus on the wavefield out to distances comparable to L. At distances much smaller than W, two-dimensional plane-strain slip-pulse models (i.e., models in which the lateral extent of the slip zone is unbounded) accurately predict the subsurface wavefield. Amplitudes in the shear Mach wedge of those models are undiminished with distance from the fault. When viewed from distances far greater than W, rupture is accurately modeled as a moving point source that produces a shear Mach cone and, on the free surface, Rayleigh-wave Mach fronts. Geometrical spreading of the shear Mach cone occurs radially and amplitudes there decrease with the inverse square-root of distance. The transition between these two asymptotic limits occurs at distances comparable to W. Similar considerations suggest that Rayleigh Mach waves suffer no attenuation in the ideally elastic medium studied here. The rate at which fault strength weakens at the rupture front exerts a strong influence on the off-fault fields only in the immediate vicinity of the fault (for both sub-Rayleigh and supershear ruptures) and at the Mach fronts of supershear ruptures. More rapid weakening generates larger amplitudes at the Mach fronts.","author":"Dunham, E. M. and Bhat, H. S.","doi":"10.1029/2007jb005182","journal":"J. Geophys. Res.","number":"B08319","pubnumber":"6","title":"Attenuation of radiated ground motion and stresses from three-dimensional supershear ruptures","volume":"113","year":"2008","bdsk-url-1":"https://doi.org/10.1029/2007JB005182","ENTRYTYPE":"article","ID":"dunham2008a","_raw":"@article{dunham2008a,\n\tabstract = {Radiating shear and Rayleigh waves from supershear ruptures form Mach waves that transmit large-amplitude ground motion and stresses to locations far from the fault. We simulate bilateral ruptures on a finite-width vertical strike-slip fault (of width W and half-length L with L >> W) breaking the surface of an elastic half-space, and focus on the wavefield out to distances comparable to L. At distances much smaller than W, two-dimensional plane-strain slip-pulse models (i.e., models in which the lateral extent of the slip zone is unbounded) accurately predict the subsurface wavefield. Amplitudes in the shear Mach wedge of those models are undiminished with distance from the fault. When viewed from distances far greater than W, rupture is accurately modeled as a moving point source that produces a shear Mach cone and, on the free surface, Rayleigh-wave Mach fronts. Geometrical spreading of the shear Mach cone occurs radially and amplitudes there decrease with the inverse square-root of distance. The transition between these two asymptotic limits occurs at distances comparable to W. Similar considerations suggest that Rayleigh Mach waves suffer no attenuation in the ideally elastic medium studied here. The rate at which fault strength weakens at the rupture front exerts a strong influence on the off-fault fields only in the immediate vicinity of the fault (for both sub-Rayleigh and supershear ruptures) and at the Mach fronts of supershear ruptures. More rapid weakening generates larger amplitudes at the Mach fronts.},\n\tauthor = {Dunham, E. M. and Bhat, H. S.},\n\tdoi = {10.1029/2007jb005182},\n\tjournal = {J. Geophys. Res.},\n\tnumber = {B08319},\n\tpubnumber = {6},\n\ttitle = {Attenuation of radiated ground motion and stresses from three-dimensional supershear ruptures},\n\tvolume = {113},\n\tyear = {2008}\n}","_pdf":"https://filedn.eu/lg5rE6ReEB4XtX4pGFBGRh4/CollectedPapers/article/DunhamBhat2008a.pdf"},{"author":"Bhat, H. S. and Biegel, R. L. and Rosakis, A. J. and Sammis, C. G","doi":"10.1016/j.tecto.2010.03.016","journal":"Tectonophysics","number":"3","pages":"263--271","pubnumber":"13","title":"The Effect of Asymmetric Damage on Dynamic Shear Rupture Propagation II: With Mismatch in Bulk Elasticity","volume":"493","year":"2010","bdsk-url-1":"https://doi.org/10.1016/j.tecto.2010.03.016","ENTRYTYPE":"article","ID":"bhat2010a","_raw":"@article{bhat2010a,\n\tauthor = {Bhat, H. S. and Biegel, R. L. and Rosakis, A. J. and Sammis, C. G},\n\tdoi = {10.1016/j.tecto.2010.03.016},\n\tjournal = {Tectonophysics},\n\tnumber = {3},\n\tpages = {263--271},\n\tpubnumber = {13},\n\ttitle = {The Effect of Asymmetric Damage on Dynamic Shear Rupture Propagation II: With Mismatch in Bulk Elasticity},\n\tvolume = {493},\n\tyear = {2010}\n}","_pdf":"https://filedn.eu/lg5rE6ReEB4XtX4pGFBGRh4/CollectedPapers/article/BhatBiegelRosakis2010a.pdf"},{"author":"Biegel, R. L. and Bhat, H. S. and Sammis, C. G. and Rosakis, A. J.","doi":"10.1016/j.tecto.2010.03.020","journal":"Tectonophysics","number":"3","pages":"254--262","pubnumber":"12","title":"The Effect of Asymmetric Damage on Dynamic Shear Rupture Propagation I: No Mismatch in Bulk Elasticity","volume":"493","year":"2010","bdsk-url-1":"https://doi.org/10.1016/j.tecto.2010.03.020","ENTRYTYPE":"article","ID":"biegel2010","_raw":"@article{biegel2010,\n\tauthor = {Biegel, R. L. and Bhat, H. S. and Sammis, C. G. and Rosakis, A. J.},\n\tdoi = {10.1016/j.tecto.2010.03.020},\n\tjournal = {Tectonophysics},\n\tnumber = {3},\n\tpages = {254--262},\n\tpubnumber = {12},\n\ttitle = {The Effect of Asymmetric Damage on Dynamic Shear Rupture Propagation I: No Mismatch in Bulk Elasticity},\n\tvolume = {493},\n\tyear = {2010}\n}","_pdf":"https://filedn.eu/lg5rE6ReEB4XtX4pGFBGRh4/CollectedPapers/article/BiegelBhatSammis2010a.pdf"},{"author":"Bhat, H. S. and Olives, M. and Dmowska, R. and Rice, J. R.","doi":"10.1029/2007jb005027","journal":"J. Geophys. Res.","pubnumber":"4","title":"Role of fault branches in earthquake rupture dynamics","volume":"B11309","year":"2007","bdsk-url-1":"http://dx.doi.org/10.1029/2007JB005027","ENTRYTYPE":"article","ID":"bhat2007b","_raw":"@article{bhat2007b,\n\tauthor = {Bhat, H. S. and Olives, M. and Dmowska, R. and Rice, J. R.},\n\tdoi = {10.1029/2007jb005027},\n\tjournal = {J. Geophys. Res.},\n\tpubnumber = {4},\n\ttitle = {Role of fault branches in earthquake rupture dynamics},\n\tvolume = {B11309},\n\tyear = {2007}\n}","_pdf":"https://filedn.eu/lg5rE6ReEB4XtX4pGFBGRh4/CollectedPapers/article/BhatOlivesDmowska2007a.pdf"},{"author":"Fliss, S. and Bhat, H. S. and Dmowska, R. and Rice, J. R.","doi":"10.1029/2004jb003368","journal":"J. Geophys. Res.","keywords":"MustRead","pubnumber":"2","title":"Fault branching and rupture directivity","volume":"B06312","year":"2005","bdsk-url-1":"https://doi.org/10.1029/2004JB003368","ENTRYTYPE":"article","ID":"fliss2005","_raw":"@article{fliss2005,\n\tauthor = {Fliss, S. and Bhat, H. S. and Dmowska, R. and Rice, J. R.},\n\tdoi = {10.1029/2004jb003368},\n\tjournal = {J. Geophys. Res.},\n\tkeywords = {MustRead},\n\tpubnumber = {2},\n\ttitle = {Fault branching and rupture directivity},\n\tvolume = {B06312},\n\tyear = {2005}\n}","_pdf":"https://filedn.eu/lg5rE6ReEB4XtX4pGFBGRh4/CollectedPapers/article/FlissBhatDmowska2005a.pdf"},{"abstract":"We extend a model of a two-dimensional self-healing slip pulse, propagating dynamically in steady-state with slip-weakening failure crite- rion, to the supershear regime, in order to study the off-fault stressing in- duced by such a slip pulse and investigate features unique to the supershear range. Specifically, we show that there exists a non-attenuating stress field behind the Mach front that radiates high stresses arbitrarily far from the fault (practically this would be limited to distances comparable to the depth of the seismogenic zone), thus being capable of creating fresh damage or induc- ing Coulomb failure in known structures at large distances away from the main fault. We allow for both strike-slip and dip-slip failure induced by such a slip pulse. We show that off-fault damage is controlled by the speed of the slip-pulse, scaled stress drop and principal stress orientation of the pre-stress field. We apply this model to study damage features induced during the 2001 Kokoxili (Kunlun) event in Tibet, for which it has been suggested that much of the rupture was supershear. We argue that an interval of simultaneous in- duced normal faulting is more likely due to a slip partitioning mechanism suggested previously than to the special features of supershear rupture. How- ever, those features do provide an explanation for otherwise anomalous ground cracking at several kilometers from the main fault. We also make some es- timates of fracture energy which, for a given net slip and dynamic stress drop, is lower than for a sub-Rayleigh slip pulse, because part of the energy fed by the far-field stress is radiated back along the Mach fronts.","author":"Bhat, H. S. and Dmowska, R. and King, G. C. P. and Klinger, Y. and Rice, J. R.","doi":"10.1029/2006jb004425","journal":"J. Geophys. Res.","keywords":"MustRead","pubnumber":"5","title":"Off-fault damage patterns due to supershear ruptures with application to the 2001 ${M}_w$ 8.1 Kokoxili (Kunlun) Tibet earthquake","volume":"B06301","year":"2007","bdsk-url-1":"https://doi.org/10.1029/2006JB004425","ENTRYTYPE":"article","ID":"bhat2007a","_raw":"@article{bhat2007a,\n\tabstract = {We extend a model of a two-dimensional self-healing slip pulse, propagating dynamically in steady-state with slip-weakening failure crite- rion, to the supershear regime, in order to study the off-fault stressing in- duced by such a slip pulse and investigate features unique to the supershear range. Specifically, we show that there exists a non-attenuating stress field behind the Mach front that radiates high stresses arbitrarily far from the fault (practically this would be limited to distances comparable to the depth of the seismogenic zone), thus being capable of creating fresh damage or induc- ing Coulomb failure in known structures at large distances away from the main fault. We allow for both strike-slip and dip-slip failure induced by such a slip pulse. We show that off-fault damage is controlled by the speed of the slip-pulse, scaled stress drop and principal stress orientation of the pre-stress field. We apply this model to study damage features induced during the 2001 Kokoxili (Kunlun) event in Tibet, for which it has been suggested that much of the rupture was supershear. We argue that an interval of simultaneous in- duced normal faulting is more likely due to a slip partitioning mechanism suggested previously than to the special features of supershear rupture. How- ever, those features do provide an explanation for otherwise anomalous ground cracking at several kilometers from the main fault. We also make some es- timates of fracture energy which, for a given net slip and dynamic stress drop, is lower than for a sub-Rayleigh slip pulse, because part of the energy fed by the far-field stress is radiated back along the Mach fronts.},\n\tauthor = {Bhat, H. S. and Dmowska, R. and King, G. C. P. and Klinger, Y. and Rice, J. R.},\n\tdoi = {10.1029/2006jb004425},\n\tjournal = {J. Geophys. Res.},\n\tkeywords = {MustRead},\n\tpubnumber = {5},\n\ttitle = {Off-fault damage patterns due to supershear ruptures with application to the 2001 ${M}_w$ 8.1 Kokoxili (Kunlun) Tibet earthquake},\n\tvolume = {B06301},\n\tyear = {2007}\n}","_pdf":"https://filedn.eu/lg5rE6ReEB4XtX4pGFBGRh4/CollectedPapers/article/BhatDmowskaKing2007a.pdf"},{"author":"Bhat, H. S. and Dmowska, R. and Rice, J. R. and Kame, N.","doi":"10.1785/0120040601","journal":"Bull. Seism. Soc. Am.","pages":"S202--S213","pubnumber":"1","title":"Dynamic slip transfer from the Denali to Totschunda faults, Alaska: Testing theory for fault branching","topics":"dynamics, branching, numerical models, BIEM","volume":"94","year":"2004","bdsk-url-1":"https://doi.org/10.1785/01200 <script>
(function () {
'use strict';

// ── Data ─────────────────────────────────────────────────────────────────────
// Filled in by build_pubs.py from MasterBibliography.bib and mypubs.txt.
// Edit publications-template.html, not publications/index.html.
var DATA = JSON.parse(document.getElementById('pubs-data').textContent);

var GROUP_LABEL = { article: 'Articles', book: 'Books & chapters', conference: 'Conference papers', thesis: 'Theses', other: 'Other' };

// PDF links (to the pCloud CollectedPapers folder) are resolved at build time.
function pdfUrl(entry) { return entry._pdf || null; }

// ── LaTeX to text ────────────────────────────────────────────────────────────
var ACCENT = { '`': '\u0300', "'": '\u0301', '^': '\u0302', '~': '\u0303', '"': '\u0308', '=': '\u0304', '.': '\u0307',
               'c': '\u0327', 'v': '\u030C', 'u': '\u0306', 'H': '\u030B', 'k': '\u0328', 'r': '\u030A' };
var SYMBOL = { 'o': 'ø', 'O': 'Ø', 'ss': 'ß', 'ae': 'æ', 'AE': 'Æ', 'oe': 'œ', 'OE': 'Œ', 'aa': 'å', 'AA': 'Å', 'l': 'ł', 'L': 'Ł', 'i': 'ı' };
function clean(s) {
  if (!s) return '';
  return s
    .replace(/\\([`'^~"=.])\s*\{?\s*([A-Za-z])\s*\}?/g, function (_, a, c) { return (c + ACCENT[a]).normalize('NFC'); })
    .replace(/\\([cvuHkr])(?:\s+|\{)\s*([A-Za-z])\}?/g, function (_, a, c) { return (c + ACCENT[a]).normalize('NFC'); })
    .replace(/\{\\(ss|ae|AE|oe|OE|aa|AA|o|O|l|L|i)\}/g, function (_, k) { return SYMBOL[k]; })
    .replace(/\$([^$]*)\$/g, function (_, m) { return m.replace(/[_^]/g, ''); })   // $M_w$ -> Mw
    .replace(/\\(textbf|textit|emph|texttt|textrm|mathrm)\{([^}]*)\}/g, '$2')
    .replace(/\\&/g, '&').replace(/\\\$/g, '$').replace(/\\%/g, '%').replace(/\\#/g, '#').replace(/\\_/g, '_')
    .replace(/---/g, '—').replace(/--/g, '–').replace(/``/g, '\u201C').replace(/''/g, '\u201D')
    .replace(/~/g, '\u00A0')
    .replace(/[{}]/g, '')
    .replace(/\\[A-Za-z]+\s?/g, '')
    .replace(/\s+/g, ' ').trim();
}
function formatAuthors(str) {
  if (!str) return '';
  var list = str.split(/\s+and\s+/i).map(function (a) {
    a = clean(a);
    var last, first;
    if (a.indexOf(',') >= 0) { var parts = a.split(','); last = parts[0].trim(); first = parts.slice(1).join(',').trim(); }
    else { var w = a.split(/\s+/); last = w.pop(); first = w.join(' '); }
    var initials = first.split(/[\s.]+/).filter(Boolean).map(function (n) {
      return n.split('-').map(function (x) { return x.charAt(0).toUpperCase() + '.'; }).join('-');
    }).join(' ');
    return initials ? last + ', ' + initials : last;
  });
  if (list.length === 1) return list[0];
  if (list.length === 2) return list[0] + ' and ' + list[1];
  return list.slice(0, -1).join(', ') + ' and ' + list[list.length - 1];
}

// ── Build the list ───────────────────────────────────────────────────────────
function cleanBibtex(raw) {
  // Drop BibDesk's private fields; their values never contain braces.
  return raw.replace(/,?\s*(bdsk-file-\d+|bdsk-url-\d+|date-added|date-modified)\s*=\s*\{[^{}]*\}/gi, '')
            .replace(/\s*\}\s*$/, '\n}');
}
function buildPapers(entries, keys) {
  return entries.map(function (e) {
    var k = keys[e.ID], type = e.ENTRYTYPE;
    var venue = e.journal || e.booktitle || e.school || '';
    if (type === 'proceedings' || type === 'book') venue = e.publisher || venue;
    var vol = '';
    if (e.volume) { vol = e.volume + (e.number ? '(' + e.number + ')' : '') + (e.pages ? ', ' + e.pages : ''); }
    else if (e.pages) { vol = e.pages; }
    var arxiv = e.eprint || e.arxiv || '';
    var p = {
      id: e.ID, type: type, group: k.group, order: k.order,
      title: clean(e.title), year: parseInt(e.year, 10) || 0, yearStr: e.year || '',
      authors: e.author ? formatAuthors(e.author) : (e.editor ? formatAuthors(e.editor) + ' (eds.)' : ''),
      editors: (type === 'incollection' && e.editor) ? formatAuthors(e.editor) : '',
      venue: clean(venue), vol: clean(vol), publisher: (type === 'incollection') ? clean(e.publisher) : '',
      doi: (e.doi || '').replace(/\s+/g, ''), arxiv: arxiv.replace(/v\d+$/, ''),
      pdf: pdfUrl(e), bib: cleanBibtex(e._raw), f: e
    };
    var j = p.venue.toLowerCase();
    p.prep = j.indexOf('in prep') >= 0 || j.indexOf('to be subm') >= 0;
    p.submitted = !p.prep && /^(subm|submitted|under review)/.test(j);
    if (p.submitted) p.venue = p.venue.replace(/^(subm(itted)?\.?(\s+to)?|under review(\s+in)?)\s*/i, '');
    p.search = [p.title, e.author, p.authors, p.venue, p.id, e.keywords || '', clean(e.abstract || '')].join(' ').toLowerCase();
    return p;
  }).filter(function (p) { return p.title; });
}

// ── Render ───────────────────────────────────────────────────────────────────
var all = [], shown = [];
function esc(s) { return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function hl(text, q) {
  var t = esc(text);
  if (!q) return t;
  q.split(/\s+/).filter(Boolean).forEach(function (w) {
    var r = new RegExp('(' + esc(w).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')(?![^<]*>)', 'gi');
    t = t.replace(r, '<mark>$1</mark>');
  });
  return t;
}
function paperHTML(p, q, i) {
  var title = p.pdf ? '<a href="' + esc(p.pdf) + '" target="_blank" rel="noopener">' + hl(p.title, q) + '</a>' : hl(p.title, q);
    var tag = p.prep ? '<span class="pub-tag">In preparation</span>' : '';
  var venue = '';
  if (p.venue) {
    venue = '<em>' + hl(p.venue, q) + '</em>' + (p.vol ? ', ' + esc(p.vol) : '');
    if (p.editors) venue = 'In ' + venue + ', eds. ' + esc(p.editors);
    if (p.publisher) venue += ', ' + esc(p.publisher);
  }
  if (p.submitted) venue = '<span class="pub-tag">Submitted</span>' + (venue ? 'to ' + venue : '');
  var links = [];
  if (p.pdf) links.push('<a href="' + esc(p.pdf) + '" target="_blank" rel="noopener">PDF</a>');
  if (p.doi) links.push('<a href="https://doi.org/' + esc(p.doi) + '" target="_blank" rel="noopener">DOI</a>');
  if (p.arxiv && !/^10\./.test(p.arxiv)) links.push('<a href="https://arxiv.org/abs/' + esc(p.arxiv) + '" target="_blank" rel="noopener">arXiv</a>');
  if (!p.prep) links.push('<button type="button" data-cite="' + i + '">Cite</button>');
  if (!p.prep) links.push('<button type="button" data-bib="' + i + '">BibTeX</button>');
  return '<li class="pub' + (p.prep ? ' is-prep' : '') + '">' +
    '<h3 class="pub-title">' + tag + title + '</h3>' +
    (p.authors ? '<p class="pub-authors">' + hl(p.authors, q) + '</p>' : '') +
    (venue ? '<p class="pub-venue">' + venue + '</p>' : '') +
    '<p class="pub-links">' + links.join('') + '</p>' +
    '</li>';
}
function render() {
  var rawQ = document.getElementById('pubs-q').value.trim(), q = rawQ.toLowerCase();
  var g = document.getElementById('pubs-group').value;
  var list = all.filter(function (p) {
    if (g && p.group !== g) return false;
    return !q || q.split(/\s+/).every(function (w) { return p.search.indexOf(w) >= 0; });
  });
  // In preparation first, then newest year first; within a year, the order of mypubs.txt.
  list.sort(function (a, b) { return (a.prep !== b.prep) ? (a.prep ? -1 : 1) : (b.year - a.year) || (a.order - b.order); });
  shown = list;

  var info = document.getElementById('pubs-info');
  var noun = function (n) { return n + (n === 1 ? ' publication' : ' publications'); };
  info.textContent = rawQ ? list.length + ' matching “' + rawQ + '”' : '';

  var el = document.getElementById('pubs-list');
  if (!list.length) { el.innerHTML = '<p class="pubs-state">No publications match. Try fewer words.</p>'; return; }
  var html = [], year = null;
  list.forEach(function (p, i) {
    var y = p.prep ? 'In prep.' : String(p.year || '—');
    if (y !== year) {
      if (year !== null) html.push('</ul></section>');
      html.push('<section class="section"><h2 class="label year-label">' + esc(y) + '</h2><ul class="pub-list">');
      year = y;
    }
    html.push(paperHTML(p, rawQ, i));
  });
  html.push('</ul></section>');
  el.innerHTML = html.join('');
}

// ── AGU citation ─────────────────────────────────────────────────────────────
// AGU reference style (APA-based): Last, F. M., Last, F. M., & Last, F. M. (Year). Title. Journal, Volume(Issue), pages. https://doi.org/...
// Each piece is built twice: as HTML (italics, links) and as plain text.
function personParts(a) {
  a = clean(a);
  var last, first;
  if (a.indexOf(',') >= 0) { var parts = a.split(','); last = parts[0].trim(); first = parts.slice(1).join(',').trim(); }
  else { var w = a.split(/\s+/); last = w.pop(); first = w.join(' '); }
  var initials = first.split(/[\s.]+/).filter(Boolean).map(function (n) {
    return n.split('-').map(function (x) { return x.charAt(0).toUpperCase() + '.'; }).join('-');
  }).join(' ');
  return { last: last, initials: initials };
}
function aguNames(str, initialsFirst) {
  if (!str) return '';
  var names = str.split(/\s+and\s+/i).map(function (a) {
    var p = personParts(a);
    if (!p.initials) return p.last;
    return initialsFirst ? p.initials + ' ' + p.last : p.last + ', ' + p.initials;
  });
  if (names.length === 1) return names[0];
  if (initialsFirst) return names.length === 2 ? names[0] + ' & ' + names[1] : names.slice(0, -1).join(', ') + ', & ' + names[names.length - 1];
  if (names.length > 20) return names.slice(0, 19).join(', ') + ', … ' + names[names.length - 1];   // AGU/APA: first 19, ellipsis, last
  return names.slice(0, -1).join(', ') + ', & ' + names[names.length - 1];
}
function endDot(s) { return /[.?!]$/.test(s) ? s : s + '.'; }
function stop(s) { return /[.?!]$/.test(s) ? '' : '.'; }                       // no second full stop after "Res."
function range(s) { return s.replace(/(\w)\s*[-\u2010-\u2014]+\s*(\w)/g, '$1\u2013$2'); }   // 1208-1211 -> 1208–1211
function agu(p) {
  var f = p.f, H = [], T = [];
  var add = function (html, text) { H.push(html); T.push(text === undefined ? html : text); };
  var it = function (s) { return { h: '<i>' + esc(s) + '</i>', t: s }; };
  var group = p.group, type = p.type;
  var year = p.yearStr ? '(' + p.yearStr + ').' : '(n.d.).';
  var title = p.title, doi = p.doi ? 'https://doi.org/' + p.doi : '';

  if ((type === 'proceedings' || type === 'book') && !f.author && f.editor) {
    // Edited volume: Editors (Eds.). (Year). Title. Publisher.
    var eds = aguNames(f.editor), n = f.editor.split(/\s+and\s+/i).length;
    add(esc(endDot(eds)) + ' (' + (n > 1 ? 'Eds.' : 'Ed.') + '). ' + year, eds + ' (' + (n > 1 ? 'Eds.' : 'Ed.') + '). ' + year);
    var t1 = it(endDot(title)); add(' ' + t1.h, ' ' + t1.t);
    if (f.publisher) add(' ' + esc(endDot(clean(f.publisher))), ' ' + endDot(clean(f.publisher)));
  } else {
    var authors = aguNames(f.author || f.editor);
    add(esc(authors) + ' ' + year, authors + ' ' + year);

    if (type === 'phdthesis' || type === 'mastersthesis' || group === 'thesis') {
      // Thesis: *Title* (Doctoral dissertation). School.  (HDR: *Title* (Habilitation ..., School).)
      var kind = type === 'phdthesis' ? 'Doctoral dissertation' : (type === 'mastersthesis' ? "Master's thesis" : clean(f.booktitle || ''));
      var t2 = it(title);
      add(' ' + t2.h + (kind ? ' (' + esc(kind) + ')' : '') + '.', ' ' + t2.t + (kind ? ' (' + kind + ')' : '') + '.');
      if (f.school) add(' ' + esc(endDot(clean(f.school))), ' ' + endDot(clean(f.school)));
    } else if (type === 'incollection' || type === 'inbook') {
      // Chapter: Title. In F. Editor (Ed.), *Book* (pp. x–y). Publisher.
      add(' ' + esc(endDot(title)), ' ' + endDot(title));
      var inner = '';
      if (f.editor) { var ne = f.editor.split(/\s+and\s+/i).length; inner = aguNames(f.editor, true) + ' (' + (ne > 1 ? 'Eds.' : 'Ed.') + '), '; }
      var book = clean(f.booktitle || ''), pages = range(clean(f.pages || ''));
      add(' In ' + esc(inner) + '<i>' + esc(book) + '</i>' + (pages ? ' (pp. ' + esc(pages) + ')' : '') + '.',
          ' In ' + inner + book + (pages ? ' (pp. ' + pages + ')' : '') + '.');
      if (f.publisher) add(' ' + esc(endDot(clean(f.publisher))), ' ' + endDot(clean(f.publisher)));
    } else {
      // Article (also conference papers): Title. *Journal*, *Volume*(Issue), pages.
      add(' ' + esc(endDot(title)), ' ' + endDot(title));
      var journal = p.venue;   // already cleaned, "subm." removed
      if (p.submitted) {
        add(journal ? ' Submitted to <i>' + esc(journal) + '</i>' + stop(journal) : ' Manuscript submitted for publication.',
            journal ? ' Submitted to ' + journal + stop(journal) : ' Manuscript submitted for publication.');
      } else if (journal) {
        var vol = clean(f.volume || ''), num = range(clean(f.number || '')), pg = range(clean(f.pages || '').replace(/\.$/, ''));
        // Article numbers (e2026JB033983, 114990) or page ranges stored in the issue field go after the volume instead.
        if (num && !pg && (/\u2013/.test(num) || /^\d{5,}$/.test(num) || (/[A-Za-z]/.test(num) && /\d{3,}/.test(num)))) { pg = num; num = ''; }
        var h = '<i>' + esc(journal) + '</i>', t = journal;
        if (vol) { h += ', <i>' + esc(vol) + '</i>'; t += ', ' + vol; }
        if (num) { h += '(' + esc(num) + ')'; t += '(' + num + ')'; }
        if (pg)  { h += ', ' + esc(pg); t += ', ' + pg; }
        add(' ' + h + stop(t), ' ' + t + stop(t));
      }
    }
  }
  if (doi) add(' <a href="' + esc(doi) + '">' + esc(doi) + '</a>', ' ' + doi);
  var html = H.join(''), text = T.join('');
  if (p.pdf) { html += '<br>PDF: <a href="' + esc(p.pdf) + '">' + esc(p.pdf) + '</a>'; text += '\nPDF: ' + p.pdf; }
  return { html: html, text: text };
}

// ── Cite / BibTeX dialog ─────────────────────────────────────────────────────
var dlg = document.getElementById('bib-dialog'), body = document.getElementById('bib-body'),
    head = document.getElementById('bib-title'), copyBtn = document.getElementById('bib-copy');
var current = null;   // what the Copy button copies: { html?, text }
function openDialog(kind, p) {
  if (kind === 'cite') {
    var c = agu(p);
    current = c;
    head.textContent = '';
    body.innerHTML = '<p class="cite-text" id="copy-target">' + c.html + '</p>';
  } else {
    current = { text: p.bib };
    head.textContent = 'BibTeX';
    body.innerHTML = '<pre class="bib-code" id="copy-target"></pre>';
    body.firstChild.textContent = p.bib;
  }
  copyBtn.textContent = 'Copy';
  if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
}
document.getElementById('pubs-list').addEventListener('click', function (e) {
  var b = e.target.closest('[data-cite], [data-bib]');
  if (!b) return;
  var cite = b.hasAttribute('data-cite');
  openDialog(cite ? 'cite' : 'bib', shown[+b.getAttribute(cite ? 'data-cite' : 'data-bib')]);
});
document.getElementById('bib-close').addEventListener('click', function () { dlg.close(); });
dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });
copyBtn.addEventListener('click', function () {
  if (!current) return;
  var done = function () { copyBtn.textContent = 'Copied'; setTimeout(function () { copyBtn.textContent = 'Copy'; }, 1800); };
  var select = function () {
    var r = document.createRange(); r.selectNodeContents(document.getElementById('copy-target'));
    var s = getSelection(); s.removeAllRanges(); s.addRange(r); copyBtn.textContent = 'Press Cmd+C';
  };
  var cb = navigator.clipboard;
  if (current.html && cb && cb.write && window.ClipboardItem) {
    // Rich copy: email clients get italics and clickable links; plain-text fields get the text version.
    cb.write([new ClipboardItem({
      'text/html': new Blob(['<p>' + current.html + '</p>'], { type: 'text/html' }),
      'text/plain': new Blob([current.text], { type: 'text/plain' })
    })]).then(done, function () { cb.writeText(current.text).then(done, select); });
  } else if (cb && cb.writeText) {
    cb.writeText(current.text).then(done, select);
  } else select();
});

// ── Show ─────────────────────────────────────────────────────────────────────
(function () {
  var keys = DATA.keys;
  all = buildPapers(DATA.entries, keys);
  if (!all.length) {
    document.getElementById('pubs-list').innerHTML = '<p class="pubs-state">No publications found.</p>';
    return;
  }
  var sel = document.getElementById('pubs-group'), present = {};
  all.forEach(function (p) { present[p.group] = (present[p.group] || 0) + 1; });
  sel.innerHTML = '<option value="">All publications</option>' + Object.keys(GROUP_LABEL).filter(function (g) { return present[g]; })
        .map(function (g) { return '<option value="' + g + '">' + GROUP_LABEL[g] + '</option>'; }).join('');

  document.getElementById('pubs-tools').hidden = false;
  var timer;
  document.getElementById('pubs-q').addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(render, 200); });
  sel.addEventListener('change', render);
  render();
})();
})();
</script>
