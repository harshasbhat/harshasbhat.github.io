---
layout: default
---
<div class="wrap page-wrap">
  {% if page.title %}
  <header class="page-head">
    {% if page.kicker %}<p class="label">{{ page.kicker }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.intro %}<p class="page-intro">{{ page.intro }}</p>{% endif %}
  </header>
  {% endif %}

  <div class="prose{% if page.wide %} prose-wide{% endif %}">
    {{ content }}
  </div>
</div>
