# Numerical Methods (ENS Paris) — everything that changes from year to year.
# Next year: change `base` to the new pCloud folder, update the files and the sessions.

base: https://filedn.eu/lg5rE6ReEB4XtX4pGFBGRh4/Teaching/ENS/Numerical2026/

# Rows at the top of the page. `file` is relative to `base`;
# use `url:` instead of `file:` for a full address (e.g. a GitHub repo).
links:
  - title: Course syllabus
    file: Syllabus/numerical.pdf
  - title: Lecture notes on numerical methods
    file: latex/master.pdf

# The "Jupyter notebooks" dropdown, in this order. Leave empty ([]) to hide it.
notebooks:
  - title: Newton–Raphson
    file: jupyter/newton_method.ipynb
  - title: ODE solutions
    file: jupyter/euler_RK4_method.ipynb

